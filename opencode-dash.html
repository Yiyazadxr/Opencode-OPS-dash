/* Layout: 纸面工程图式大屏 —— 顶部指标轨 + 圆心偏左的大弧舞台（静止的汇聚连线 / 快速旋转的飞轮：环带数据块 + 外射谱线）+ 底部 2×4 仪表面板。浅色 = 纸与墨，深色 = 夜间荧光绿 */
:host{
  --bg:#eeede8; --panel:#f6f5f1; --band:#eeede8;
  --ink:#151515; --ink2:#4a4a46; --mute:#86857f; --hair:#d2d0c9; --hair2:#e4e2dc;
  --accent:#151515; --bar:#151515; --chip-fg:#f6f5f1; --scan:transparent;
  --c-line:#151515; --c-hi:#000000; --c-hot:#000000; --c-text:#1a1a1a; --c-dim:#7d7c77;
  --font:"JetBrains Mono","Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,"Microsoft YaHei UI",monospace;
  --cjk:"Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --display:"Archivo","Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif;
}
@media (prefers-color-scheme:dark){:host(:not([data-theme="light"])){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }}
:host([data-theme="dark"]){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }

:host{display:block;height:100%;overflow:auto}
[hidden]{display:none!important}
:host{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:11px;-webkit-font-smoothing:antialiased}
.app{min-height:100%;box-sizing:border-box;display:grid;grid-template-rows:minmax(440px,1fr) auto;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 顶部指标轨 */
.top{position:absolute;z-index:3;left:0;top:0;display:grid;grid-template-columns:repeat(3,minmax(86px,auto));gap:12px 26px;align-items:end;padding:14px 48px 34px 16px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg);background:radial-gradient(farthest-side at 0 0,color-mix(in srgb,var(--bg) 82%,transparent),color-mix(in srgb,var(--bg) 45%,transparent) 62%,transparent)}
.top .title{grid-column:1 / -1}
.cell{position:relative;min-width:0;padding-bottom:7px;border-bottom:1px solid var(--hair)}
.stat{min-width:86px}
.cell::after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent);transition:width .9s ease}
.cell.on::after{width:100%}
.title::after{width:100%;height:2px;background:var(--ink)}
.title h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(16px,1.5vw,23px);letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.title h1 .zh{font-family:var(--cjk);font-weight:700;letter-spacing:.04em}
.title p{margin:5px 0 0;font-size:8.5px;letter-spacing:.14em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p b{color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{display:block;font-size:8px;letter-spacing:.16em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k i{font-style:normal;font-family:var(--cjk);letter-spacing:.04em;margin-left:5px}
.stat .v{display:block;margin-top:6px;font-size:clamp(13px,1.05vw,16px);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{color:var(--mute);font-size:.78em}
.ctls{position:absolute;z-index:4;top:14px;right:14px;display:flex;gap:6px}
.btn{font:inherit;font-size:10px;letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--mute);padding:5px 10px;cursor:pointer;white-space:nowrap;font-family:var(--cjk)}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible,#pc:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

/* 舞台 */
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
.note{position:absolute;z-index:2;right:14px;bottom:14px;display:grid;gap:4px;min-width:220px;border-left:2px solid var(--ink);padding:4px 4px 4px 12px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.note .nh{font-size:8px;letter-spacing:.14em;color:var(--mute);border-bottom:1px solid var(--hair);padding-bottom:5px;white-space:nowrap}
.note b{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.01em;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-family:var(--font);white-space:nowrap}
.note .ns{font-size:9px;color:var(--mute);font-family:var(--cjk)}
.hud{position:absolute;z-index:2;right:14px;bottom:96px;display:grid;gap:3px;border-left:2px solid var(--ink);padding:3px 4px 3px 12px;font-size:8.5px;letter-spacing:.1em;color:var(--mute);white-space:nowrap;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.hud b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.hud .warn{color:var(--accent);font-weight:700}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--panel);border:1px solid var(--ink);padding:6px 9px;font-size:10.5px;line-height:1.55;font-family:var(--cjk);max-width:250px}
.tip b{font-family:var(--font);font-weight:700;margin-right:6px}
.tip span{display:block;color:var(--mute);font-family:var(--font);font-size:9px}

/* 面板 */
.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.panel{min-width:0;height:184px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);padding:9px 11px 8px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;min-width:0}

function mockTick(){
  if (!DATA.usingMock || !snap || !snap.mock) return;
  const tool = MOCK_TOOLS[(mockSeq++) % MOCK_TOOLS.length];
  const target = MOCK_TARGETS[(mockSeq * 3) % MOCK_TARGETS.length];

function relTime(ts){
  if (!ts) return '—';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return Math.round(s) + '秒前';
  const m = s / 60; if (m < 60) return Math.round(m) + '分前';
  const h = m / 60; if (h < 24) return Math.round(h) + '时前';
  return Math.round(h / 24) + '天前';
}
function shortLabel(s, n){
  s = String(s == null ? '' : s);

async function loadSnapshot(){

function bindRowActivation(el, open){

/* 安全转义：连引号一起转义，避免源码里的 class="str" 被浏览器当成属性解析 */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

/* 语法高亮：先分词、再逐段转义，绝不把源码当 HTML 解析 */
const HL_RE = /(\/\/[^\n]*)|('[^']*'?)|(\b(?:for|in|if|def|return|not|assert|lambda|const|let|var|function|class|import|from|export|async|await|new|null|true|false)\b)/g;
const hl = s => {
  const raw = String(s == null ? '' : s);
  let out = '', last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(raw)) !== null) {
    out += esc(raw.slice(last, m.index));
    const cls = m[1] ? 'cm' : m[2] ? 'str' : 'kw';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
    if (m[0].length === 0) HL_RE.lastIndex++;
  }
  return out + esc(raw.slice(last));
};

/* ---------- 工作台打字机：播放真实文件内容，一段结束自动切下一段 ---------- */
let wsLines = [], wsCl = 0, wsCc = 0, wsPause = 0, wsHold = 0;
let wsQueue = [], wsIndex = -1;
function setWorkspaceText(code){
  const lines = String(code || '').split(/\r?\n/);
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  wsLines = lines.slice(0, 60);
  wsCl = 0; wsCc = 0; wsPause = 0; wsHold = 0;
  renderCode();
}
function renderCode(){
  const H = codeEl.clientHeight || 144;           // 实际可见高度
  const fit = Math.max(1, Math.floor((H - 2) / CODE_LH));
  if (!wsLines.length){
    codeEl.innerHTML = '<span class="row"><span class="ln">···</span>等待真实的写入 / 编辑…</span>';
    return;
  }
  // 多渲染一点余量，再把容器滚到底 —— 光标始终是最后一行可见行，且滚动连续不跳行
  const from = Math.max(0, wsCl - fit - 6);
  let html = '';
  for (let i = from; i <= wsCl; i++){
    const txt = i < wsCl ? wsLines[i] : wsLines[i].slice(0, wsCc);
    html += `<span class="row${i === wsCl ? ' cur' : ''}"><span class="ln">${String(i + 1).padStart(3, '0')}</span>${hl(txt)}${i === wsCl ? '<span class="caret"></span>' : ''}</span>`;
  }
  codeEl.innerHTML = html;
  if (codeEl.scrollHeight > codeEl.clientHeight) codeEl.scrollTop = codeEl.scrollHeight;
}
function typeTick(){
  if (!wsLines.length) return;
  if (wsPause > 0){ wsPause--; return; }
  const line = wsLines[wsCl] || '';
  if (wsCc >= line.length){
    if (wsCl < wsLines.length - 1){ wsCl++; wsCc = 0; wsPause = 2; }
    else {
      // 本段播完 → 停一会儿，切下一段
      if (++wsHold > 36){ wsHold = 0; nextWorkspace(); }
      return;
    }
  } else {
    wsCc += Math.random() < 0.5 ? 4 : 2;
    if (wsCc > line.length) wsCc = line.length;
  }
  renderCode();
}

/* ---------- 工作台内容按需拉取（按队列轮播） ---------- */
async function loadWorkspaceItem(i){
  const item = wsQueue[i];
  if (!item) return;
  wsIndex = i;
  const key = (item.sessionID || '') + '|' + (item.partID || '');
  if (key === DATA.wsKey) return;
  DATA.wsKey = key;
  try {
    const q = `/detail?sessionID=${encodeURIComponent(item.sessionID)}&partID=${encodeURIComponent(item.partID || '')}`;
    const d = await fetchJSON(q);
    if (!d || !d.item) return;

  } catch (e) { /* 忽略 */ }
}
function nextWorkspace(){
  if (wsQueue.length < 2){ wsHold = 0; return; }
  const next = (wsIndex + 1) % wsQueue.length;
  loadWorkspaceItem(next);
}
async function ensureWorkspace(){
  const q = (snap && snap.workspaceQueue) || [];
  wsQueue = q;
  if (!wsQueue.length) return;

/* ================= 5. 主舞台 ================= */
const stage = $('#stage'), sc = $('#sc'), sctx = sc.getContext('2d'), tip = $('#tip');
let W = 1, H = 1, DPR = 1, G = null, layThreads = null, layRing = null;
let hubs = [], pulses = [], blocks = [], streaks = [], blockFS = 8, blockLH = 11;
let hoverHub = -1, needs = true, stageDirty = true;
const hubCh = [-10, -10, -10];   // 三个汇聚节点上次刷新的时间
let hubTurn = 0;
const ax = (Rr, y) => G.cx + Math.sqrt(Math.max(0, Rr * Rr - (y - G.cy) * (y - G.cy)));
const visAng = (Rr, pad) => Math.asin(Math.min(1, (Math.max(G.cy, H - G.cy) + pad) / Rr));
function mkLayer(){ const cv = document.createElement('canvas'); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); return [cv, c]; }
/* 辉光：复用一块离屏画布，避免每次布局都新建 canvas */
let bloomCv = null, bloomCtx = null;
function bloom(cv, c, amount){
  if (!T.dark || typeof c.filter !== 'string') return;
  if (!bloomCv) {
    bloomCv = document.createElement('canvas');
    bloomCtx = bloomCv.getContext('2d');
    if (!bloomCtx) return;
  }
  if (bloomCv.width !== cv.width || bloomCv.height !== cv.height) {
    bloomCv.width = cv.width; bloomCv.height = cv.height;
  } else {
    bloomCtx.clearRect(0, 0, bloomCv.width, bloomCv.height);
  }
  bloomCtx.filter = `blur(${3 * DPR}px)`; bloomCtx.drawImage(cv, 0, 0);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter'; c.globalAlpha = amount; c.drawImage(bloomCv, 0, 0); c.restore();
}

function layoutStage(){
  const r = sc.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);

    const e = t - hubCh[i];
    let s = full;
    if (e >= 0 && e < 0.6) {
      const n = Math.floor(e / 0.6 * full.length);
      s = full.slice(0, n) + Array.from(full.slice(n), ch => ch === ' ' ? ' ' : GLYPH[(Math.random() * GLYPH.length) | 0]).join('');
    }
    const fresh = e >= 0 && e < 1.1, jump = e >= 0 && e < 0.4 ? -6 * Math.sin(e / 0.4 * Math.PI) : 0;
    const x = h.x - 30, y = h.y - 16 + jump;
    c.font = `700 ${fs}px ${FONT}`;
    const tw = c.measureText(s).width;
    c.globalAlpha = 1; c.fillStyle = fresh ? T.text : T.bg; c.fillRect(x - tw - 6, y - fs * 0.8, tw + 12, fs * 1.6);
    if (!fresh) { c.strokeStyle = T.text; c.globalAlpha = 0.5; c.lineWidth = 0.8; c.strokeRect(x - tw - 6 + 0.5, y - fs * 0.8 + 0.5, tw + 11, fs * 1.6 - 1); c.globalAlpha = 1; }
    c.fillStyle = fresh ? T.band : T.text; c.fillText(s, x, y);
    const sub = nd
      ? `${nd.calls24h} 次调用 · 成功率 ${(nd.rate * 100).toFixed(0)}% · ${nd.sessions} 会话`
      : `${h.curves.length} src · 视觉模拟`;
    c.font = `500 ${fs - 1.5}px ${FONT}`;
    const sw = c.measureText(sub).width;
    c.fillStyle = T.bg; c.fillRect(x - sw - 4, y + fs * 0.85, sw + 8, fs * 1.25);
    c.fillStyle = T.dim; c.fillText(sub, x, y + fs * 1.45);
    if (e >= 0 && e < 0.7) {
      const k = e / 0.7;
      c.strokeStyle = T.dark ? T.hot : T.line; c.globalAlpha = 1 - k; c.lineWidth = 1.4;
      c.beginPath(); c.arc(h.x - 6, h.y, 10 + k * 70, 0, TAU); c.stroke(); c.globalAlpha = 1;
    }
  });
  c.textAlign = 'left';
}

let nextGlitch = 6, glitchUntil = 0;
function drawStage(t, dt){
  const c = sctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = T.bg; c.fillRect(0, 0, sc.width, sc.height);
  c.drawImage(layThreads, 0, 0); c.drawImage(layRing, 0, 0);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWheelStreaks(c, t, dt); drawBeam(c, t); drawGears(c, t); drawWheelMarks(c, t); drawPulses(c, dt); drawBlocks(c, t); drawHubMarks(c, t); drawHubLabels(c, t);
  if (T.dark && !reduce && dt > 0) {
    if (t > nextGlitch) { glitchUntil = t + 0.1; nextGlitch = t + 5 + Math.random() * 5; }
    if (t < glitchUntil) {
      c.setTransform(1, 0, 0, 1, 0, 0);
      for (let k = 0; k < 3; k++) { const y = Math.random() * sc.height, h = (4 + Math.random() * 24) * DPR, dx = (Math.random() - 0.5) * 36 * DPR; c.drawImage(sc, 0, y, sc.width, h, dx, y, sc.width, h); }
    }
  }
}

function showTip(){
  const h = hubs[hoverHub]; if (!h) return;
  const nd = h.node;
  tip.innerHTML = nd
    ? `<b>${esc(nd.name)}</b>${esc(nd.dir)}<span>24h ${nd.calls24h} 次工具调用 · 成功率 ${(nd.rate * 100).toFixed(1)}% · ${nd.sessions} 个会话</span>`
    : `<b>FLOW</b>视觉模拟<span>该节点暂未绑定真实项目</span>`;
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(W - tw - 8, h.x + 14)) + 'px';
  tip.style.top = Math.max(8, Math.min(H - th - 8, h.y + 16)) + 'px';
}
function onPointer(e){
  if (!G) return;
  const r = sc.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let h = -1; hubs.forEach((hb, i) => { if (Math.hypot(x - (hb.x - 6), y - hb.y) < 34) h = i; });
  if (h !== hoverHub) { hoverHub = h; needs = true; }
  if (h >= 0) showTip(); else tip.hidden = true;
}
sc.addEventListener('pointermove', onPointer);
sc.addEventListener('pointerdown', onPointer);
sc.addEventListener('pointerleave', () => { hoverHub = -1; tip.hidden = true; needs = true; });

/* ================= 6. 主循环与控制 ================= */
let simT = 0, last = performance.now(), paused = false;
/* 打字机并进主循环，不再单开一个 16ms 定时器 */
let typeAcc = 0;

/* 一帧的工作：布局、绘制、打字机。rAF 与兜底定时器共用，避免两处逻辑各写一遍 */
function stepScene(dt){
  if (stageDirty) { layoutStage(); stageDirty = false; needs = true; }
  if (dt > 0 || needs) { drawStage(simT, dt); needs = false; }
  if (dt > 0){
    typeAcc += dt;
    if (typeAcc >= 0.016) { typeAcc = 0; typeTick(); }
  }
}
fullBtn.addEventListener('click', () => {
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => { fullBtn.textContent = '不支持'; setTimeout(() => fullBtn.textContent = '全屏', 1500); });
  } catch (e) { /* 部分窗口不允许全屏 */ }
});
document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? '退出全屏' : '全屏'; });
themeBtn.addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; });
function onTheme(){ readTheme(); stageDirty = true; }
new MutationObserver(onTheme).observe(root, {attributes: true, attributeFilter: ['data-theme']});
darkMQ.addEventListener('change', onTheme);

let rafAlive = false;
function frame(now){
  rafAlive = true;
  requestAnimationFrame(frame);
  if (host.hidden) { last = now; return; }
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = paused ? 0 : real; simT += dt;
  try { stepScene(dt); } catch (err) { console.error(err); }
}
/* 启动动画主循环 */
requestAnimationFrame(frame);

/* 兜底：某些环境（无头浏览器 / 后台标签页）不触发 requestAnimationFrame，
   此时用 30fps 定时器接管，保证飞轮照常旋转 */
setInterval(() => {
  if (rafAlive || host.hidden) return;
  const t = performance.now();
  const real = Math.min(0.05, (t - last) / 1000); last = t;
  const dt = paused ? 0 : real; simT += dt;
  try { stepScene(dt); } catch (err) { /* 忽略 */ }
}, 33);

/* 工具成功率 HUD */
function hudTick(){
  const st = snap && snap.stats;
  if (!st){ $('#rel').textContent = '—'; $('#relst').textContent = '—'; return; }
  const rate = st.tasks ? (st.succeeded / st.tasks) : 0;
  $('#rel').textContent = (rate * 100).toFixed(1) + '%';
  const s = $('#relst');
  if (st.failedOnly > 0){ s.textContent = st.failedOnly + ' FAILED'; s.className = 'warn'; }
  else { s.textContent = 'OK'; s.className = ''; }
}
function clockTick(){ $('#clock').textContent = hms(new Date()); }
let hiIdx = 1; const cells = [...SR.querySelectorAll('.stat')];
function cycleHi(){ cells.forEach((el, i) => el.classList.toggle('on', i === hiIdx)); hiIdx = (hiIdx + 1) % cells.length; }

const ro = new ResizeObserver(entries => {
  for (const e of entries) { if (e.target === stage) stageDirty = true; }
  renderFeed(); needs = true;
});
[stage].forEach(el => ro.observe(el));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { stageDirty = true; });

/* ---------- 真实数据的刷新节奏 ---------- */
readTheme();
renderAll();
loadSnapshot();

setInterval(() => { if (!paused && !host.hidden) hudTick(); }, 500);
setInterval(clockTick, 1000);
setInterval(() => { if (!paused && !host.hidden) cycleHi(); }, 4500);
setInterval(() => { if (!paused && !host.hidden) switchHub(); }, 2400);
setInterval(() => { if (!paused && !host.hidden) loadSnapshot(); }, 5000);
setInterval(() => { if (!paused && !host.hidden) updateBadge(); }, 1000);
setInterval(() => { if (!paused && !host.hidden) mockTick(); }, 1200);

/* 实时事件：OpenCode 有动静就刷新（去抖 800ms） */
try {
  const es = new EventSource('/events');
  es.onmessage = ev => {
    try {
      const j = JSON.parse(ev.data);
      if (j.type === 'bridge.error'){ DATA.error = '事件流断开'; DATA.status = 'wait'; updateBadge(); return; }
      if (j.type === 'bridge.ready'){ DATA.error = ''; updateBadge(); scheduleRefresh(); return; }
      if (j.type && j.type.indexOf('session.') === 0) scheduleRefresh();
    } catch (e) {}
  };
  es.onerror = () => { /* EventSource 会自动重连 */ };
} catch (e) {}
function scheduleRefresh(){
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; loadSnapshot(); }, 800);
}
}

/* ================= 外壳：挂载 OPS 纸面工程主题 ================= */
(() => {
  'use strict';
  const host = document.getElementById('host-ops');
  host.hidden = false;
  const SR = host.attachShadow({mode: 'open'});
  SR.appendChild(document.getElementById('tpl-ops').content.cloneNode(true));
  try { mountOps(host, SR); } catch (e) { console.error(e); }
})();

</script>
